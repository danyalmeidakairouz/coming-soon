    <style>
        /* CSS Reset and Global Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body, html {
            height: 100%;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #111111;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Container Styling */
        .container {
            max-width: 800px; 
            padding: 40px 20px;
            width: 100%;
        }

        /* Logo Styling */
        .logo {
            max-width: 300px;
            width: 80%;
            height: auto;
            margin-bottom: 80px; 
            /* Inverts the black logo to white for the dark background */
            filter: invert(1);
        }

        /* Typography */
        h1 {
            font-size: 4rem; 
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        p {
            font-size: 1.1rem;
            color: #cccccc;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto; 
        }

        /* Footer / Links Section */
        .bottom-links {
            display: flex;
            justify-content: center;
            gap: 60px; /* Space between the two sections */
            margin-top: 60px;
            padding-top: 40px;
            border-top: 1px solid #333333;
        }

        .link-section h3 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #888888;
            margin-bottom: 15px;
            font-weight: 400;
        }

        .icon-group {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .icon-group a {
            color: #cccccc;
            font-size: 1.5rem;
            text-decoration: none;
            transition: color 0.3s ease, transform 0.2s ease;
        }

        .icon-group a:hover {
            color: #ffffff;
            transform: scale(1.1);
        }

        /* Responsive Design for Mobile */
        @media (max-width: 600px) {
            h1 {
                font-size: 2.5rem; 
            }
            .logo {
                margin-bottom: 50px;
            }
            .bottom-links {
                flex-direction: column;
                gap: 40px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="Artboard 1.png" alt="Simply Photons Logo" class="logo">
        
        <h1>Let there be light!</h1>
        <p>Oh, shoot! I left the lens cap on again.<br>Give us a second to fix the exposure.</p>

        <div class="bottom-links">
            
            <div class="link-section">

                    <a href="mailto:dany.almeidakairouz@simplyphotons.ca" aria-label="Email Us"><i class="fa-solid fa-envelope"></i></a>
                </div>
            </div>

            <div class="link-section">
                <h3>Follow Us</h3>
                <div class="icon-group">
                    <a href="https://www.instagram.com/simplyphotons" aria-label="Instagram" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-instagram"></i></a>
                    
                    <a href="https://www.youtube.com/@SimplyPhotons" aria-label="YouTube" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-youtube"></i></a>
                </div>
            </div>

        </div>
    </div>

</body>
